<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Lock the viewport: real fullscreen, no pinch-zoom, cover notches/cutouts. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Matrix</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    overscroll-behavior: none;            /* no rubber-banding */
    touch-action: none;                   /* no scroll/zoom gestures */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;          /* no long-press menu */
    -webkit-tap-highlight-color: transparent;
  }
  /* Fixed, full-screen canvas anchored to the true top-left (under any cutout). */
  #c { display: block; position: fixed; top: 0; left: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Matrix "digital rain" -- ANDROID KIOSK / WEBVIEW build.
// Same rain engine and tunables as wallpaper/matrix.html (keep them identical);
// only the PLATFORM layer differs: orientation-aware glyph sizing instead of the
// desktop window.screen.height assumption, an Android-safe font stack, a
// devicePixelRatio cap for weaker tablet GPUs, screen wake-lock, and tap-to-exit.
// Each grid cell keeps its OWN character and brightness: the leading head is
// near-white, the trail behind it is the SAME characters fading to green, and
// occasionally a random cell flips to a new glyph (the authentic flicker).
(function () {
  // ---- tunables ---------------------------------------------------------
  const FRAME_MS   = 50;     // higher = slower animation (~20 fps)
  const SPEED_MIN  = 0.30;   // rows advanced per frame (lower = slower fall)
  const SPEED_MAX  = 0.70;
  const DECAY      = 0.97;    // trail fade per frame (higher = longer tails)
  const FLASH_BOOST = 0.5;    // momentary extra glow when a glyph changes/flips
  const FLASH_DECAY = 0.45;   // how fast that flash fades (low = brief); base tail fade unchanged
  const CHANGE_CHANCE = 0.10; // per-frame chance a lit trailing glyph silently morphs (constant churn)
  const MORPH_STEP = 0.25;    // glyph-switch fade speed (1/frames) -- higher = quicker switch
  const MORPH_DIP  = 0.65;    // how far a glyph dims at the switch midpoint (fade old out -> swap -> fade new in)
  const GLITCH_RATE = 0.0020; // fraction of cells that change glyph WITH a flash (emphasis)
  const FLIP_RATE   = 0.0015; // fraction of cells mirrored horizontally per frame
  const FLIP_CHANCE = 0.28;   // chance a freshly-lit glyph spawns mirrored
  const INTERRUPT_CHANCE = 0.0005; // per-frame chance a whole column is wiped & restarted -- RARE (full-line removal)
  // "being edited": each erase punches a gap of a RANDOM scale into a lit stream --
  // mostly a few stray characters, sometimes a segment, occasionally a long chunk
  // (a whole-column wipe is the separate INTERRUPT_CHANCE above).
  const SEG_ERASE_RATE = 0.12;  // erase attempts per frame -- small-portion edits (kept modest so they don't strip standing lines)
  const SEG_SMALL_FRAC = 0.72;  // share of erases that nibble just a few chars
  const SEG_MED_FRAC = 0.24;    // share that take out a mid-size segment (rest = long chunk)
  const SEG_SMALL_MIN = 1, SEG_SMALL_MAX = 3;
  const SEG_MED_MIN = 5, SEG_MED_MAX = 18;
  const SEG_LARGE_MIN = 28, SEG_LARGE_MAX = 44;
  const SPAWN_ON_ERASE = 0.15;  // chance an erase also seeds a NEW falling head at the gap (a third way streams are built)
  const TOP_SPROUT_CHANCE = 0.30; // per-frame chance to drop a fresh white head at the top of a bare-topped frozen column (refills the top; self-limits as the screen fills)
  const RESTART_GAP = 22;     // how far above the top a finished column restarts
  const FREEZE_CHANCE = 0.20; // when a head reaches the bottom: chance the fallen line STAYS in place
                              //   (frozen, still churning) instead of restarting -- raise for more, lower for fewer
  const MID_FREEZE_CHANCE = 0.002; // per-frame chance a still-FALLING line stops mid-screen and freezes in place
  const MIN_FREEZE_LEN = 10;  // a line must have drawn at least this many chars before it may freeze (no 1-char freezes)
  const STAY_BRIGHT = 0.78;   // brightness ceiling for a frozen line: it holds the glow it had, capped here (steady green, never a white head)
  // ---- kiosk/platform tunables -----------------------------------------
  const GRID_DIV   = 48;     // glyph rows across the SHORT screen edge (higher = smaller, denser rain)
  const DPR_CAP    = 2;      // cap devicePixelRatio -- keeps a 3x tablet panel from over-rendering
  const FONT_STACK = "'Noto Sans Mono CJK JP','Noto Sans CJK JP','Droid Sans Mono',monospace";
  const LEVELS     = 48;     // brightness quantization for the glyph atlas (49 tiles/glyph; matches src/Matrix.cs)
  // -----------------------------------------------------------------------

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  const codes = [];
  for (let c = 0xFF66; c <= 0xFF9D; c++) codes.push(c);                 // katakana
  for (const ch of "0123456789*+-/<>=:;.?!^|()[]{}~") codes.push(ch.charCodeAt(0));
  // returns a GLYPH INDEX into codes[] (not a char code) -- the atlas is keyed by index,
  // so the render hot loop needs no String.fromCharCode and no lookup (mirrors C# GlyphIdx)
  const code = () => (Math.random() * codes.length) | 0;

  // Weighted erase length: usually a few characters, sometimes a segment, rarely a long chunk.
  function segLen() {
    const t = Math.random();
    if (t < SEG_SMALL_FRAC) return SEG_SMALL_MIN + ((Math.random() * (SEG_SMALL_MAX - SEG_SMALL_MIN + 1)) | 0);
    if (t < SEG_SMALL_FRAC + SEG_MED_FRAC) return SEG_MED_MIN + ((Math.random() * (SEG_MED_MAX - SEG_MED_MIN + 1)) | 0);
    return SEG_LARGE_MIN + ((Math.random() * (SEG_LARGE_MAX - SEG_LARGE_MIN + 1)) | 0);
  }

  let W, H, fontSize, cellW, cellH, cols, rows, fontStr;
  let bright, chars, flip, flash, head, speed, prevRow, sprouts, frozen, lit, morph, morphTo;
  let atlas, atlasFlip, atlasLevels = 0;   // sprite-sheets + the level count actually baked (0 = atlas unavailable)

  // Same gradient as the live render path (and src/Matrix.cs): pure-white head ->
  // matrix green -> black tail, keyed by quantized level. maxLevel = top index in use.
  function levelColor(l, maxLevel) {
    const bb = l / maxLevel;
    let cr, cg, cb;
    if (bb >= 0.8) { const t = (bb - 0.8) / 0.2; cr = (255 * t) | 0; cg = 255; cb = (70 + 185 * t) | 0; }
    else { const t = bb / 0.8; cr = 0; cg = (255 * t) | 0; cb = (70 * t) | 0; }
    return 'rgb(' + cr + ',' + cg + ',' + cb + ')';
  }

  // Paint one sprite-sheet (normal or mirrored) with `nLevels` brightness tiles per glyph.
  // Returns the canvas, or null if this device can't allocate it (weak/old WebView canvas
  // limits -> getContext null or the dimensions get clamped). Layout: glyph -> column, level -> row.
  function paintSheet(nLevels, mirror) {
    const sheetW = codes.length * cellW, sheetH = nLevels * cellH;
    try {
      const cv = document.createElement('canvas');
      cv.width = sheetW; cv.height = sheetH;
      if (cv.width !== sheetW || cv.height !== sheetH) return null;   // device clamped the size
      const g = cv.getContext('2d', { alpha: false });
      if (!g) return null;                                           // out of canvas memory
      g.fillStyle = '#000'; g.fillRect(0, 0, sheetW, sheetH);
      g.font = fontStr; g.textBaseline = 'top';
      for (let gi = 0; gi < codes.length; gi++) {
        const ch = String.fromCharCode(codes[gi]);   // build-time only, never per frame
        const dx = gi * cellW;
        for (let l = 0; l < nLevels; l++) {
          g.fillStyle = levelColor(l, nLevels - 1);
          if (mirror) { g.save(); g.translate(dx + cellW, l * cellH); g.scale(-1, 1); g.fillText(ch, 0, 0); g.restore(); }
          else g.fillText(ch, dx, l * cellH);
        }
      }
      return cv;
    } catch (e) { return null; }
  }

  // Pre-render every glyph at every brightness level into two offscreen sprite-sheets
  // (normal + mirrored), so each frame is a fast drawImage blit instead of a per-cell
  // fillText. This is the canvas analogue of the glyph bitmap cache in src/Matrix.cs.
  // If the device can't allocate a full-size atlas (weak/old kiosk WebView), halve the
  // level count and retry -- the fast path survives, only the gradient gets coarser.
  // atlasLevels === 0 means even the smallest atlas failed and render() falls back to
  // direct fillText. Rebuilt from resize() when cell size / font changes -- never per frame.
  function buildAtlas() {
    atlas = atlasFlip = null; atlasLevels = 0;
    for (let lv = LEVELS; lv >= 6; lv = lv >> 1) {
      const a = paintSheet(lv + 1, false);
      const f = a && paintSheet(lv + 1, true);
      if (a && f) { atlas = a; atlasFlip = f; atlasLevels = lv; return; }
    }
  }

  function resize() {
    // Cap the pixel ratio so a 2x/3x tablet panel doesn't render millions of extra
    // cells per frame -- the rain looks the same and stays smooth on weak GPUs.
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    const cssW = window.innerWidth, cssH = window.innerHeight;
    W = canvas.width = Math.floor(cssW * dpr);
    H = canvas.height = Math.floor(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    // Glyph size keyed to the SHORT edge of THIS screen, so the rain has the same
    // density in portrait or landscape and on any tablet -- no desktop-monitor guess.
    fontSize = Math.max(12, Math.floor(Math.min(W, H) / GRID_DIV));
    fontStr = "bold " + fontSize + "px " + FONT_STACK;
    ctx.font = fontStr;
    ctx.textBaseline = 'top';
    cellW = Math.max(6, Math.ceil(ctx.measureText('ｴ').width));
    cellH = Math.ceil(fontSize * 1.05);

    cols = Math.max(1, Math.floor(W / cellW));
    rows = Math.max(1, Math.floor(H / cellH) + 1);

    bright  = new Float32Array(cols * rows);
    chars   = new Uint16Array(cols * rows);
    flip    = new Uint8Array(cols * rows);
    flash   = new Float32Array(cols * rows);
    morph   = new Float32Array(cols * rows);  // per-cell glyph-switch fade phase (1 -> 0; 0 = none)
    morphTo = new Uint16Array(cols * rows);   // pending glyph index to swap to at the fade midpoint
    head    = new Float32Array(cols);
    speed   = new Float32Array(cols);
    prevRow = new Int32Array(cols);
    sprouts = [];   // secondary heads spawned where code was erased (reset on resize)
    frozen  = new Uint8Array(cols);   // 1 = column has frozen into static code (set on reaching bottom)
    lit     = new Int32Array(cols);   // length of each column's current falling line (gates freezing)
    for (let c = 0; c < cols; c++) {
      head[c] = -Math.random() * rows;
      speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      prevRow[c] = Math.floor(head[c]);
    }
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.imageSmoothingEnabled = false;   // crisp 1:1 integer blits (canvas DrawImageUnscaled)
    buildAtlas();                        // (re)bake the glyph sheets for the new cell size
  }

  window.addEventListener('resize', resize);
  // Tablets fire orientationchange slightly before the new size is final; settle, then resize.
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  resize();

  function step() {
    // 1) fade every cell a little (trail keeps its character, just dims). Frozen columns
    //    DON'T fade to black: a bright head settles down to STAY_BRIGHT and then holds, so
    //    the column stays as steady, still-churning code until it's edited away.
    for (let c = 0; c < cols; c++) {
      const fr = frozen[c];
      const base = c * rows;
      for (let r = 0; r < rows; r++) {
        const i = base + r;
        if (fr) {
          if (bright[i] > STAY_BRIGHT) { bright[i] *= DECAY; if (bright[i] < STAY_BRIGHT) bright[i] = STAY_BRIGHT; }
        } else if (bright[i] > 0.001) {
          bright[i] *= DECAY;
        }
        flash[i] = (flash[i] > 0.001) ? flash[i] * FLASH_DECAY : 0;
        // glyph churn with a soft fade: dim the old char out, swap at the dim point, fade the new in
        if (morph[i] > 0) {
          morph[i] -= MORPH_STEP;
          if (morph[i] <= 0.5) chars[i] = morphTo[i];
          if (morph[i] < 0) morph[i] = 0;
        } else if (bright[i] > 0.12 && Math.random() < CHANGE_CHANCE) {
          morphTo[i] = code(); morph[i] = 1.0;
        }
      }
    }

    // 2) advance each column's head, lighting new cells with fresh glyphs.
    for (let c = 0; c < cols; c++) {
      const base = c * rows;
      if (frozen[c]) {
        // Frozen column: stays as static churning code until an interrupt edits it away (now
        // rare), then a fresh head falls from the top to re-write the lost line of code.
        if (Math.random() < INTERRUPT_CHANCE) {
          for (let r = 0; r < rows; r++) { bright[base + r] = 0; flash[base + r] = 0; }
          frozen[c] = 0;
          head[c] = -((Math.random() * RESTART_GAP) | 0);
          prevRow[c] = Math.floor(head[c]);
          speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
          lit[c] = 0;
        }
        continue;
      }
      head[c] += speed[c];
      const nr = Math.floor(head[c]);
      if (nr !== prevRow[c]) {
        for (let r = prevRow[c] + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            const idx = base + r;
            chars[idx] = code();
            flip[idx] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[idx] = 1.0;
            lit[c]++;   // grow this line's length -- gates freezing so short stubs can't stay
          }
        }
        prevRow[c] = nr;
      }
      if (head[c] > rows + 6) {
        // only a long-enough line may stay; short ones just restart from the top
        if (lit[c] >= MIN_FREEZE_LEN && Math.random() < FREEZE_CHANCE) {
          // reached the bottom -> the fallen line STAYS as-is: no relight, no new head. It
          // holds the code it already drew and keeps churning until an interrupt edits it away.
          frozen[c] = 1;
        } else {
          head[c] = -((Math.random() * RESTART_GAP) | 0);
          prevRow[c] = Math.floor(head[c]);
          speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
          lit[c] = 0;
        }
      } else if (lit[c] >= MIN_FREEZE_LEN && Math.random() < MID_FREEZE_CHANCE) {
        // a long-enough still-falling line can stop mid-screen and freeze in place, holding the
        // code it has drawn so far and churning -- just like a line that reached the bottom.
        frozen[c] = 1;
      } else if (Math.random() < INTERRUPT_CHANCE) {
        // "being edited" (rare): wipe this whole stream, then replace it -- half the time a
        // fresh stream from the top (renewal), half a mid-screen reappearance (edit).
        for (let r = 0; r < rows; r++) { const idx = base + r; bright[idx] = 0; flash[idx] = 0; }
        head[c] = (Math.random() < 0.5) ? -Math.random() * RESTART_GAP : Math.random() * rows;
        prevRow[c] = Math.floor(head[c]);
        speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
        lit[c] = 0;
      }
    }

    // 3) flicker: change a few random lit cells to a new glyph (authentic churn)
    const glitches = Math.max(1, (cols * rows * GLITCH_RATE) | 0);
    for (let k = 0; k < glitches; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.15) { chars[idx] = code(); flash[idx] = FLASH_BOOST; }
    }

    // 4) ...and mirror a few other random lit cells horizontally
    const flips = Math.max(1, (cols * rows * FLIP_RATE) | 0);
    for (let k = 0; k < flips; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.15) { flip[idx] ^= 1; flash[idx] = FLASH_BOOST; }
    }

    // 6) ...and punch random-scale gaps into random lit streams ("sections taken out"):
    //    a few stray characters, a mid-size segment, or a long chunk -- see segLen()
    const segErases = Math.max(1, (cols * SEG_ERASE_RATE) | 0);
    for (let k = 0; k < segErases; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.2) {
        const base = ((idx / rows) | 0) * rows;
        const r0 = idx % rows;
        const len = segLen();
        for (let r = r0; r < r0 + len && r < rows; r++) { bright[base + r] = 0; flash[base + r] = 0; }
        // ...and sometimes regrow: drop a fresh head in at the top of the gap so a NEW
        // stream re-writes where code was just removed (third build path).
        if (sprouts.length < cols && Math.random() < SPAWN_ON_ERASE) {
          chars[base + r0] = code(); flip[base + r0] = (Math.random() < FLIP_CHANCE) ? 1 : 0; bright[base + r0] = 1.0;
          sprouts.push({ col: (idx / rows) | 0, pos: r0, speed: SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN), prev: r0 });
        }
      }
    }

    // 6b) keep the TOP from going bare: occasionally drop a fresh white head at the top of a
    //     frozen column whose top has faded out. It falls and re-lights the column, meeting /
    //     overwriting the standing line below (which holds at STAY_BRIGHT as the head passes).
    if (sprouts.length < cols && Math.random() < TOP_SPROUT_CHANCE) {
      const col = (Math.random() * cols) | 0;
      if (frozen[col] && bright[col * rows] < 0.3) {
        const b = col * rows;
        chars[b] = code(); flip[b] = (Math.random() < FLIP_CHANCE) ? 1 : 0; bright[b] = 1.0;
        sprouts.push({ col: col, pos: 0, speed: SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN), prev: 0 });
      }
    }

    // 7) advance those regrowth heads like the main heads, dropping them off the bottom
    for (let s = sprouts.length - 1; s >= 0; s--) {
      const sp = sprouts[s];
      sp.pos += sp.speed;
      const nr = Math.floor(sp.pos);
      if (nr !== sp.prev) {
        const b = sp.col * rows;
        for (let r = sp.prev + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            chars[b + r] = code();
            flip[b + r] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[b + r] = 1.0;
          }
        }
        sp.prev = nr;
      }
      if (sp.pos > rows + 6) sprouts.splice(s, 1);
    }
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (atlasLevels > 0) {
      // fast path: each lit cell is one pre-rendered glyph blit
      for (let c = 0; c < cols; c++) {
        const x = c * cellW;
        const base = c * rows;
        for (let r = 0; r < rows; r++) {
          const i = base + r;
          let b = bright[i] + flash[i];
          if (b <= 0.04) continue;
          if (morph[i] > 0) b *= 1 - MORPH_DIP * (1 - Math.abs(morph[i] * 2 - 1)); // soft fade on glyph switch
          if (b > 1) b = 1;                            // clamp BEFORE quantizing (flash can push b > 1)
          let lvl = (b * atlasLevels + 0.5) | 0;       // round to nearest baked level
          if (lvl > atlasLevels) lvl = atlasLevels;
          ctx.drawImage(flip[i] ? atlasFlip : atlas, chars[i] * cellW, lvl * cellH, cellW, cellH, x, r * cellH, cellW, cellH);
        }
      }
      return;
    }
    // fallback: the atlas couldn't be allocated on this device -- draw glyphs directly
    // (slower, but guarantees the rain still renders rather than failing to load).
    ctx.font = fontStr;
    for (let c = 0; c < cols; c++) {
      const x = c * cellW;
      const base = c * rows;
      for (let r = 0; r < rows; r++) {
        const i = base + r;
        let b = bright[i] + flash[i];
        if (b <= 0.04) continue;
        if (morph[i] > 0) b *= 1 - MORPH_DIP * (1 - Math.abs(morph[i] * 2 - 1));
        if (b > 1) b = 1;
        let cr, cg, cb;
        if (b >= 0.8) { const t = (b - 0.8) / 0.2; cr = (255 * t) | 0; cg = 255; cb = (70 + 185 * t) | 0; }
        else { const t = b / 0.8; cr = 0; cg = (255 * t) | 0; cb = (70 * t) | 0; }
        ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
        const ch = String.fromCharCode(codes[chars[i]]);   // chars stores a glyph INDEX
        if (flip[i]) { ctx.save(); ctx.translate(x + cellW, r * cellH); ctx.scale(-1, 1); ctx.fillText(ch, 0, 0); ctx.restore(); }
        else ctx.fillText(ch, x, r * cellH);
      }
    }
  }

  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < FRAME_MS) return;
    last = t;
    step();
    render();
  }
  requestAnimationFrame(loop);

  // Keep the panel awake while the rain shows (kiosk apps usually do this too, but
  // this re-asserts it). Re-acquire after the tab is backgrounded and returns.
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') keepAwake();
  });
  keepAwake();

  // Tap-to-exit: most kiosk browsers dismiss their own screensaver on touch, so this
  // is a harmless extra -- window.close() simply no-ops where the browser disallows it.
  window.addEventListener('pointerdown', function () { try { window.close(); } catch (e) {} }, { passive: true });
})();
</script>
</body>
</html>
