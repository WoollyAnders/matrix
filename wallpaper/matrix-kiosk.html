<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Lock the viewport: real fullscreen, no pinch-zoom, cover notches/cutouts. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Matrix</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    overscroll-behavior: none;            /* no rubber-banding */
    touch-action: none;                   /* no scroll/zoom gestures */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;          /* no long-press menu */
    -webkit-tap-highlight-color: transparent;
  }
  /* Fixed, full-screen canvas anchored to the true top-left (under any cutout). */
  #c { display: block; position: fixed; top: 0; left: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Matrix "digital rain" -- ANDROID KIOSK / WEBVIEW build.
// Same rain engine and tunables as wallpaper/matrix.html (keep them identical);
// only the PLATFORM layer differs: orientation-aware glyph sizing instead of the
// desktop window.screen.height assumption, an Android-safe font stack, a
// devicePixelRatio cap for weaker tablet GPUs, screen wake-lock, and tap-to-exit.
// Each grid cell keeps its OWN character and brightness: the leading head is
// near-white, the trail behind it is the SAME characters fading to green, and
// occasionally a random cell flips to a new glyph (the authentic flicker).
(function () {
  // ---- tunables ---------------------------------------------------------
  const FRAME_MS   = 50;     // higher = slower animation (~20 fps)
  const SPEED_MIN  = 0.30;   // rows advanced per frame (lower = slower fall)
  const SPEED_MAX  = 0.70;
  // NO FADE: a lit cell does NOT decay to black -- a fresh head settles to the steady body
  // brightness and HOLDS there. Columns clear only via erases / collapses / interrupts.
  const BODY_BRIGHT = 0.62;   // steady green a lit cell holds at (== the color-ramp split)
  const HEAD_SETTLE = 0.80;   // per-frame multiplier above BODY_BRIGHT -> taller (~3-cell) bright head, easier to pick out
  // Green-blue (teal-leaning) ramp with a near-white -- not pure white -- head. [r,g,b]
  const COL_TAIL = [0, 25, 18];     // deep teal, only seen briefly as a cell clears
  const COL_BODY = [0, 235, 140];   // steady Matrix green (blue-leaning vs the old 0,255,70)
  const COL_HEAD = [235, 255, 250]; // near-white mint head (bright, but not 255,255,255)
  const FLASH_BOOST = 0.5;    // momentary extra glow when a glyph changes/flips
  const FLASH_DECAY = 0.45;   // how fast that flash fades (low = brief); base tail fade unchanged
  const CHANGE_CHANCE = 0.04; // per-frame chance a lit trailing glyph silently morphs (constant churn) -- lowered: fewer changes
  const MORPH_STEP = 0.45;    // glyph-switch fade speed (1/frames) -- higher = quicker switch (raised: snappier swap)
  const MORPH_DIP  = 0.65;    // how far a glyph dims at the switch midpoint (fade old out -> swap -> fade new in)
  const GLITCH_RATE = 0.0012; // fraction of cells that change glyph WITH a flash (emphasis)
  // Group morph: most changes are a single glyph, but a triggered morph sometimes takes a few
  // CONTIGUOUS neighbors with it, so a small block switches at the same instant (not chunk-ONLY).
  const CHUNK_CHANCE = 0.15;  // share of triggered morphs that become a group instead of a single
  const CHUNK_MIN = 2, CHUNK_MAX = 6; // group length (rows) when a morph spreads
  const FLIP_RATE   = 0.0015; // fraction of cells mirrored horizontally per frame
  const FLIP_CHANCE = 0.28;   // chance a freshly-lit glyph spawns mirrored
  const INTERRUPT_CHANCE = 0.00004; // per-frame chance a whole column is wiped INSTANTLY -- kept, but VERY rare (much rarer than a whole-line backspace); most line removal is the animated COLLAPSE below
  // "Backspace" collapse: a standing line being deleted from its END (the bottom, the most-
  // recently-written glyph) upward, one or two glyphs per frame -- like holding backspace.
  // Usually it stops at a random height (a section); rarely it takes the whole line (then the
  // column restarts). This is the PRIMARY way lines are removed; INTERRUPT is the rare exception.
  const COLLAPSE_CHANCE = 0.020; // per-frame chance a FROZEN (standing) column begins a backspace collapse (the PRIMARY deletion form); high so frozen lines don't sit static
  const COLLAPSE_FULL_FRAC = 0.12; // share of collapses that take the WHOLE line (rest stop at a random height)
  const COLLAPSE_MIN = 4, COLLAPSE_MAX = 30; // partial-collapse length in rows ("stops at a random height")
  const COLLAPSE_SPEED = 3;   // rows backspaced per frame (the key-repeat cadence)
  // "being edited": each erase punches a gap of a RANDOM scale into a lit stream --
  // mostly a few stray characters, sometimes a segment, occasionally a long chunk
  // (a whole-column wipe is the separate INTERRUPT_CHANCE above).
  const SEG_ERASE_RATE = 0.12;  // erase attempts per frame -- constant "editing" of every line (incl. still-falling ones), so lines don't pile up solid; backspace is how STANDING lines are removed
  const SEG_SMALL_FRAC = 0.72;  // share of erases that nibble just a few chars
  const SEG_MED_FRAC = 0.24;    // share that take out a mid-size segment (rest = long chunk)
  const SEG_SMALL_MIN = 1, SEG_SMALL_MAX = 3;
  const SEG_MED_MIN = 5, SEG_MED_MAX = 18;
  const SEG_LARGE_MIN = 28, SEG_LARGE_MAX = 44;
  const SPAWN_ON_ERASE = 0.15;  // chance an erase also seeds a NEW falling head at the gap (a third way streams are built)
  const TOP_SPROUT_CHANCE = 0.30; // per-frame chance to drop a fresh white head at the top of a bare-topped frozen column (refills the top; self-limits as the screen fills)
  const RESTART_GAP = 60;     // how far above the top a finished column restarts -- larger = columns REST (dark, headless) longer between streams, so fewer heads fall at once and the field is less crowded
  const FREEZE_CHANCE = 0.30; // when a head reaches the bottom: chance the fallen line STAYS in place
                              //   (frozen, still churning) instead of restarting -- raise for more, lower for fewer
  const MID_FREEZE_CHANCE = 0.002; // per-frame chance a still-FALLING line stops mid-screen and freezes in place
  const MIN_FREEZE_LEN = 10;  // a line must have drawn at least this many chars before it may freeze (no 1-char freezes)
  const STAY_BRIGHT = BODY_BRIGHT; // frozen "standing code" holds at the same steady green as an active body (freeze is now only a lifecycle state)
  // ---- kiosk/platform tunables -----------------------------------------
  const GRID_DIV   = 32;     // glyph rows across the SHORT screen edge (higher = smaller, denser rain). 32 (was
                             // 48) ~halves the cell count -- the direct-fillText path cost scales with the number
                             // of lit cells, so fewer/bigger glyphs is the main lag lever on this tablet.
  const DPR_CAP    = 1;      // cap devicePixelRatio. 1 on the EPIC Clock tablet: a 2x framebuffer is 4x the
                             // pixels/frame for its weak GPU. Softer glyphs are unnoticeable in a screensaver;
                             // not crashing matters more. Raise only on hardware proven to handle it.
  const FONT_STACK = "'Noto Sans Mono CJK JP','Noto Sans CJK JP','Droid Sans Mono',monospace";
  const LEVELS     = 48;     // brightness quantization for the glyph atlas (49 tiles/glyph; matches src/Matrix.cs)
  // The pre-rendered glyph ATLAS is a perf optimization: render() blits each cell from a sprite-sheet
  // (drawImage) instead of calling fillText. On the EPIC Clock tablet's WebView that blit is ALSO the
  // crash. A single-row atlas overran the GPU max-texture size and blitted black (no crash, but no rain);
  // once 2D-packing made the sheet small enough to sample REAL pixels, the per-cell textured drawImage --
  // thousands per frame -- took down the GPU/render process (white screen -> kiosk drops to launcher ->
  // "A-E Clock restarted after Uncaught Crash"). Shrinking the atlas didn't help: the fault is the textured
  // blit itself, not its size. So on the kiosk we force render()'s direct-fillText fallback, which never
  // touches a texture-backed blit. Slower, but it can't hit that driver fault. Re-enable only if proven safe.
  const USE_ATLAS  = false;  // PERMANENTLY OFF on this tablet. Confirmed on device: the atlas crashes the GPU at
                             // DPR 2 (fast) AND at DPR 1 (slower to crash, but still does) -- so the fault is the
                             // textured drawImage blit itself, not its size. It's also SLOWER than fillText here
                             // (the canvas-atlas isn't GPU-accelerated in this WebView). render() stays on the
                             // direct-fillText path; speed comes from fewer cells (GRID_DIV) + the cached palette.
  // Eerie glow on the kiosk: shadowBlur on each fillText (NOT the self-drawImage bloom the
  // lock/wallpaper use -- drawing the canvas onto itself is exactly the textured blit that
  // crashed this tablet's GPU). shadowBlur is a SOFTWARE blur, no texture, so it can't hit
  // that fault -- but it is CPU-costly per glyph. If the tablet lags or stutters, lower this
  // (0 disables glow) or raise GRID_DIV / FRAME_MS. Confirm FPS on-device.
  const GLOW_RADIUS = 6;     // px shadowBlur behind each glyph (0 = no glow); raised for a stronger glow -- recheck FPS on-device
  // (No dedicated head glow on the kiosk: a texture-blit halo sprite would risk this tablet's GPU,
  //  and a per-head shadowBlur is too slow. The per-glyph shadowBlur above is the only glow here.)
  // -----------------------------------------------------------------------

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  const codes = [];
  for (let c = 0xFF66; c <= 0xFF9D; c++) codes.push(c);                 // katakana
  for (const ch of "0123456789*+-/<>=:;.?!^|()[]{}~") codes.push(ch.charCodeAt(0));
  // returns a GLYPH INDEX into codes[] (not a char code) -- the atlas is keyed by index,
  // so the render hot loop needs no String.fromCharCode and no lookup (mirrors C# GlyphIdx)
  const code = () => (Math.random() * codes.length) | 0;
  // Prebuilt glyph strings, indexed by glyph index (what chars[] stores), so the direct-fillText
  // hot loop avoids a String.fromCharCode allocation per cell per frame.
  const glyphChars = [];
  for (let _gi = 0; _gi < codes.length; _gi++) glyphChars.push(String.fromCharCode(codes[_gi]));

  // Weighted erase length: usually a few characters, sometimes a segment, rarely a long chunk.
  function segLen() {
    const t = Math.random();
    if (t < SEG_SMALL_FRAC) return SEG_SMALL_MIN + ((Math.random() * (SEG_SMALL_MAX - SEG_SMALL_MIN + 1)) | 0);
    if (t < SEG_SMALL_FRAC + SEG_MED_FRAC) return SEG_MED_MIN + ((Math.random() * (SEG_MED_MAX - SEG_MED_MIN + 1)) | 0);
    return SEG_LARGE_MIN + ((Math.random() * (SEG_LARGE_MAX - SEG_LARGE_MIN + 1)) | 0);
  }

  let W, H, fontSize, cellW, cellH, cols, rows, fontStr;
  let bright, chars, flip, flash, head, speed, prevRow, sprouts, frozen, lit, morph, morphTo, collapse;
  let atlas, atlasFlip, atlasLevels = 0, atlasPerRow = 0;   // sprite-sheets + baked level count + glyph-tiles per atlas row (0 levels = atlas unavailable)

  // Same gradient as the live render path (and src/Matrix.cs): near-white mint head ->
  // teal-green body -> deep-teal tail. Split at BODY_BRIGHT so a held body cell == COL_BODY.
  // maxLevel = top index in use.
  function levelColor(l, maxLevel) {
    const bb = l / maxLevel;
    let a, b, t;
    if (bb >= BODY_BRIGHT) { a = COL_BODY; b = COL_HEAD; t = (bb - BODY_BRIGHT) / (1 - BODY_BRIGHT); }
    else { a = COL_TAIL; b = COL_BODY; t = bb / BODY_BRIGHT; }
    const cr = (a[0] + (b[0] - a[0]) * t) | 0;
    const cg = (a[1] + (b[1] - a[1]) * t) | 0;
    const cb = (a[2] + (b[2] - a[2]) * t) | 0;
    return 'rgb(' + cr + ',' + cg + ',' + cb + ')';
  }

  // Cached gradient palette: PALETTE_N prebuilt rgb strings keyed by quantized brightness, so the
  // direct-fillText hot loop sets fillStyle from a REUSED string instead of building "rgb(r,g,b)" and
  // garbage-collecting it for every lit cell, every frame. Look is identical (64 levels is smooth);
  // same gradient formula as levelColor / the atlas / src/Matrix.cs.
  const PALETTE_N = 64;
  const palette = [];
  for (let _pk = 0; _pk < PALETTE_N; _pk++) palette.push(levelColor(_pk, PALETTE_N - 1));

  // Paint one sprite-sheet (normal or mirrored). Tiles are packed in 2D -- `perRow`
  // tiles per row, wrapping to as many rows as needed -- so NEITHER dimension exceeds
  // the texture cap (a single long row did, and blitted black). Tile index
  // ti = glyph*nLevels + level sits at (ti % perRow, ti / perRow). Returns the canvas,
  // or null if the device clamps the size or can't allocate it.
  function paintSheet(nLevels, perRow, mirror) {
    const tilesT = codes.length * nLevels;
    const rowsT = Math.ceil(tilesT / perRow);
    const sheetW = perRow * cellW, sheetH = rowsT * cellH;
    try {
      const cv = document.createElement('canvas');
      cv.width = sheetW; cv.height = sheetH;
      if (cv.width !== sheetW || cv.height !== sheetH) return null;   // device clamped the size
      const g = cv.getContext('2d', { alpha: false });
      if (!g) return null;                                           // out of canvas memory
      g.fillStyle = '#000'; g.fillRect(0, 0, sheetW, sheetH);
      g.font = fontStr; g.textBaseline = 'top';
      for (let gi = 0; gi < codes.length; gi++) {
        const ch = String.fromCharCode(codes[gi]);   // build-time only, never per frame
        for (let l = 0; l < nLevels; l++) {
          const ti = gi * nLevels + l;
          const dx = (ti % perRow) * cellW, dy = ((ti / perRow) | 0) * cellH;
          g.fillStyle = levelColor(l, nLevels - 1);
          if (mirror) { g.save(); g.translate(dx + cellW, dy); g.scale(-1, 1); g.fillText(ch, 0, 0); g.restore(); }
          else g.fillText(ch, dx, dy);
        }
      }
      return cv;
    } catch (e) { return null; }
  }

  // Confirm a freshly painted sheet actually BLITS (not just allocates): some WebViews
  // accept an oversized canvas yet draw nothing from it. Copy the brightest tile of
  // glyph 0 onto a scratch canvas and check it isn't all black. Cheap insurance against
  // a silent black screen -- on failure, render() drops to the direct-draw fallback.
  function atlasBlits(sheet, lv, perRow) {
    try {
      const ti = lv;                              // glyph 0, brightest level (= lv): near-white ink
      const sx = (ti % perRow) * cellW, sy = ((ti / perRow) | 0) * cellH;
      const t = document.createElement('canvas');
      t.width = cellW; t.height = cellH;
      const tg = t.getContext('2d');
      tg.fillStyle = '#000'; tg.fillRect(0, 0, cellW, cellH);
      tg.drawImage(sheet, sx, sy, cellW, cellH, 0, 0, cellW, cellH);
      const d = tg.getImageData(0, 0, cellW, cellH).data;
      for (let i = 0; i < d.length; i += 4) if (d[i] || d[i + 1] || d[i + 2]) return true;
      return false;
    } catch (e) { return false; }
  }

  // Pre-render every glyph at every brightness level into two 2D-packed sprite-sheets
  // (normal + mirrored), so each frame is a fast drawImage blit instead of a per-cell
  // fillText. This is the canvas analogue of the glyph bitmap cache in src/Matrix.cs.
  // The atlas is packed under the GPU's texture cap; if the full-resolution sheet won't
  // fit (too tall) or won't blit on this device, halve the level count and retry -- the
  // fast path survives, only the gradient gets coarser. atlasLevels === 0 means even the
  // smallest atlas failed and render() falls back to direct fillText. Rebuilt from
  // resize() when cell size / font changes -- never per frame.
  function buildAtlas() {
    atlas = atlasFlip = null; atlasLevels = 0; atlasPerRow = 0;
    if (!USE_ATLAS) return;            // forced direct-fillText on this device -- see USE_ATLAS (atlasLevels stays 0)
    // Pack under a CONSERVATIVE FIXED cap -- NOT the device's real MAX_TEXTURE_SIZE.
    // 2048 is the GLES2-guaranteed minimum, so it is safe in BOTH dimensions on every
    // GPU and well under this tablet's ~4096 limit. We deliberately do NOT probe the cap
    // with a throwaway WebGL context: spinning one up next to the large 2D atlas canvases
    // destabilized the EPIC Clock tablet's GPU process (white screen -> render-process-
    // gone -> the whole kiosk app crashes and restarts), and probing only ever let us
    // build a BIGGER atlas -- exactly the wrong direction on a weak tablet GPU. A
    // smaller-than-strictly-needed atlas is free here: it is built once per resize and
    // every tile blit costs the same regardless of sheet size.
    const cap = 2048;
    const perRow = Math.max(1, (cap / cellW) | 0);   // glyph-tiles per row that fit under the width cap
    for (let lv = LEVELS; lv >= 6; lv = lv >> 1) {
      const nLevels = lv + 1;
      const rowsT = Math.ceil(codes.length * nLevels / perRow);
      if (rowsT * cellH > cap) continue;             // too tall at this level count -- coarsen and retry
      const a = paintSheet(nLevels, perRow, false);
      const f = a && paintSheet(nLevels, perRow, true);
      if (a && f && atlasBlits(a, lv, perRow) && atlasBlits(f, lv, perRow)) {
        atlas = a; atlasFlip = f; atlasLevels = lv; atlasPerRow = perRow; return;
      }
    }
  }

  function resize() {
    // Cap the pixel ratio so a 2x/3x tablet panel doesn't render millions of extra
    // cells per frame -- the rain looks the same and stays smooth on weak GPUs.
    const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
    const cssW = window.innerWidth, cssH = window.innerHeight;
    W = canvas.width = Math.floor(cssW * dpr);
    H = canvas.height = Math.floor(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    // Glyph size keyed to the SHORT edge of THIS screen, so the rain has the same
    // density in portrait or landscape and on any tablet -- no desktop-monitor guess.
    fontSize = Math.max(12, Math.floor(Math.min(W, H) / GRID_DIV));
    fontStr = "bold " + fontSize + "px " + FONT_STACK;
    ctx.font = fontStr;
    ctx.textBaseline = 'top';
    cellW = Math.max(6, Math.ceil(ctx.measureText('ｴ').width));
    cellH = Math.ceil(fontSize * 1.05);

    cols = Math.max(1, Math.floor(W / cellW));
    rows = Math.max(1, Math.floor(H / cellH) + 1);

    bright  = new Float32Array(cols * rows);
    chars   = new Uint16Array(cols * rows);
    flip    = new Uint8Array(cols * rows);
    flash   = new Float32Array(cols * rows);
    morph   = new Float32Array(cols * rows);  // per-cell glyph-switch fade phase (1 -> 0; 0 = none)
    morphTo = new Uint16Array(cols * rows);   // pending glyph index to swap to at the fade midpoint
    head    = new Float32Array(cols);
    speed   = new Float32Array(cols);
    prevRow = new Int32Array(cols);
    sprouts = [];   // secondary heads spawned where code was erased (reset on resize)
    frozen  = new Uint8Array(cols);   // 1 = column has frozen into static code (set on reaching bottom)
    lit     = new Int32Array(cols);   // length of each column's current falling line (gates freezing)
    collapse = new Int32Array(cols);  // rows left to backspace off a column's bottom (0 = not collapsing)
    for (let c = 0; c < cols; c++) {
      head[c] = -Math.random() * rows;
      speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      prevRow[c] = Math.floor(head[c]);
    }
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.imageSmoothingEnabled = false;   // crisp 1:1 integer blits (canvas DrawImageUnscaled)
    buildAtlas();                        // (re)bake the glyph sheets for the new cell size
  }

  window.addEventListener('resize', resize);
  // Tablets fire orientationchange slightly before the new size is final; settle, then resize.
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  resize();

  function step() {
    // 1) NO fade-to-black: a bright head SETTLES to the steady body brightness and then HOLDS
    //    there (no comet-tail). A cell goes dark only when erased / backspaced / interrupted /
    //    restarted. Frozen and falling columns settle the same way (freeze is just lifecycle).
    for (let c = 0; c < cols; c++) {
      const base = c * rows;
      for (let r = 0; r < rows; r++) {
        const i = base + r;
        if (bright[i] > BODY_BRIGHT) { bright[i] *= HEAD_SETTLE; if (bright[i] < BODY_BRIGHT) bright[i] = BODY_BRIGHT; }
        flash[i] = (flash[i] > 0.001) ? flash[i] * FLASH_DECAY : 0;
        // glyph churn with a soft fade: dim the old char out, swap at the dim point, fade the new in
        if (morph[i] > 0) {
          morph[i] -= MORPH_STEP;
          if (morph[i] <= 0.5) chars[i] = morphTo[i];
          if (morph[i] < 0) morph[i] = 0;
        } else if (bright[i] > 0.12 && Math.random() < CHANGE_CHANCE) {
          // usually a single glyph; sometimes a contiguous group switches together. Spread UPWARD
          // (cells already visited this step) so the group shares phase 1.0 and swaps in sync.
          const len = (Math.random() < CHUNK_CHANCE) ? (CHUNK_MIN + ((Math.random() * (CHUNK_MAX - CHUNK_MIN + 1)) | 0)) : 1;
          for (let k = 0; k < len && r - k >= 0; k++) {
            const j = base + r - k;
            if (bright[j] > 0.12 && morph[j] <= 0) { morphTo[j] = code(); morph[j] = 1.0; }
          }
        }
      }
    }

    // 2) advance each column's head, lighting new cells with fresh glyphs.
    for (let c = 0; c < cols; c++) {
      const base = c * rows;
      if (frozen[c]) {
        // A standing line can be BACKSPACED away from its TRAILING end (the TOP) downward, leaving
        // the leading/head end for last -- or, far more rarely, wiped instantly. Either way, once
        // it's empty a fresh head falls from the top to re-write the line.
        if (collapse[c] <= 0 && Math.random() < COLLAPSE_CHANCE) {
          collapse[c] = (Math.random() < COLLAPSE_FULL_FRAC)
            ? rows                                                              // whole line
            : (COLLAPSE_MIN + ((Math.random() * (COLLAPSE_MAX - COLLAPSE_MIN + 1)) | 0)); // stop at a random height
        }
        if (collapse[c] > 0) {
          let removed = 0;
          for (let r = 0; r < rows && removed < COLLAPSE_SPEED && collapse[c] > 0; r++) {
            const idx = base + r;
            if (bright[idx] > 0.001) { bright[idx] = 0; flash[idx] = 0; morph[idx] = 0; removed++; collapse[c]--; }
          }
          if (removed === 0) {   // nothing left to delete -> the line is gone: restart from the top
            collapse[c] = 0;
            frozen[c] = 0;
            head[c] = -((Math.random() * RESTART_GAP) | 0);
            prevRow[c] = Math.floor(head[c]);
            speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
            lit[c] = 0;
          }
        } else if (Math.random() < INTERRUPT_CHANCE) {
          for (let r = 0; r < rows; r++) { bright[base + r] = 0; flash[base + r] = 0; }
          frozen[c] = 0;
          head[c] = -((Math.random() * RESTART_GAP) | 0);
          prevRow[c] = Math.floor(head[c]);
          speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
          lit[c] = 0;
        }
        continue;
      }
      head[c] += speed[c];
      const nr = Math.floor(head[c]);
      if (nr !== prevRow[c]) {
        for (let r = prevRow[c] + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            const idx = base + r;
            chars[idx] = code();
            flip[idx] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[idx] = 1.0;
            lit[c]++;   // grow this line's length -- gates freezing so short stubs can't stay
          }
        }
        prevRow[c] = nr;
      }
      if (head[c] > rows + 6) {
        // only a long-enough line may stay; short ones just restart from the top
        if (lit[c] >= MIN_FREEZE_LEN && Math.random() < FREEZE_CHANCE) {
          // reached the bottom -> the fallen line STAYS as-is: no relight, no new head. It
          // holds the code it already drew and keeps churning until an interrupt edits it away.
          frozen[c] = 1;
        } else {
          head[c] = -((Math.random() * RESTART_GAP) | 0);
          prevRow[c] = Math.floor(head[c]);
          speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
          lit[c] = 0;
        }
      } else if (lit[c] >= MIN_FREEZE_LEN && Math.random() < MID_FREEZE_CHANCE) {
        // a long-enough still-falling line can stop mid-screen and freeze in place, holding the
        // code it has drawn so far and churning -- just like a line that reached the bottom.
        frozen[c] = 1;
      } else if (Math.random() < INTERRUPT_CHANCE) {
        // "being edited" (rare): wipe this whole stream, then replace it -- half the time a
        // fresh stream from the top (renewal), half a mid-screen reappearance (edit).
        for (let r = 0; r < rows; r++) { const idx = base + r; bright[idx] = 0; flash[idx] = 0; }
        head[c] = (Math.random() < 0.5) ? -Math.random() * RESTART_GAP : Math.random() * rows;
        prevRow[c] = Math.floor(head[c]);
        speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
        lit[c] = 0;
      }
    }

    // 3) flicker: change a few random lit cells to a new glyph (authentic churn)
    const glitches = Math.max(1, (cols * rows * GLITCH_RATE) | 0);
    for (let k = 0; k < glitches; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.15) { chars[idx] = code(); flash[idx] = FLASH_BOOST; }
    }

    // 4) ...and mirror a few other random lit cells horizontally
    const flips = Math.max(1, (cols * rows * FLIP_RATE) | 0);
    for (let k = 0; k < flips; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.15) { flip[idx] ^= 1; flash[idx] = FLASH_BOOST; }
    }

    // 6) ...and punch random-scale gaps into random lit streams ("sections taken out"):
    //    a few stray characters, a mid-size segment, or a long chunk -- see segLen()
    const segErases = Math.max(1, (cols * SEG_ERASE_RATE) | 0);
    for (let k = 0; k < segErases; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.2) {
        const base = ((idx / rows) | 0) * rows;
        const r0 = idx % rows;
        const len = segLen();
        for (let r = r0; r < r0 + len && r < rows; r++) { bright[base + r] = 0; flash[base + r] = 0; }
        // ...and sometimes regrow: drop a fresh head in at the top of the gap so a NEW
        // stream re-writes where code was just removed (third build path).
        if (sprouts.length < cols && Math.random() < SPAWN_ON_ERASE) {
          chars[base + r0] = code(); flip[base + r0] = (Math.random() < FLIP_CHANCE) ? 1 : 0; bright[base + r0] = 1.0;
          sprouts.push({ col: (idx / rows) | 0, pos: r0, speed: SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN), prev: r0 });
        }
      }
    }

    // 6b) keep the TOP from going bare: occasionally drop a fresh white head at the top of a
    //     frozen column whose top has faded out. It falls and re-lights the column, meeting /
    //     overwriting the standing line below (which holds at STAY_BRIGHT as the head passes).
    if (sprouts.length < cols && Math.random() < TOP_SPROUT_CHANCE) {
      const col = (Math.random() * cols) | 0;
      if (frozen[col] && bright[col * rows] < 0.3) {
        const b = col * rows;
        chars[b] = code(); flip[b] = (Math.random() < FLIP_CHANCE) ? 1 : 0; bright[b] = 1.0;
        sprouts.push({ col: col, pos: 0, speed: SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN), prev: 0 });
      }
    }

    // 7) advance those regrowth heads like the main heads, dropping them off the bottom
    for (let s = sprouts.length - 1; s >= 0; s--) {
      const sp = sprouts[s];
      sp.pos += sp.speed;
      const nr = Math.floor(sp.pos);
      if (nr !== sp.prev) {
        const b = sp.col * rows;
        for (let r = sp.prev + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            chars[b + r] = code();
            flip[b + r] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[b + r] = 1.0;
          }
        }
        sp.prev = nr;
      }
      if (sp.pos > rows + 6) sprouts.splice(s, 1);
    }
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (atlasLevels > 0) {
      // fast path: each lit cell is one pre-rendered glyph blit (tiles are 2D-packed:
      // tile ti = glyph*nLevels + level lives at (ti % atlasPerRow, ti / atlasPerRow))
      const nLevels = atlasLevels + 1, perRow = atlasPerRow;
      for (let c = 0; c < cols; c++) {
        const x = c * cellW;
        const base = c * rows;
        for (let r = 0; r < rows; r++) {
          const i = base + r;
          let b = bright[i] + flash[i];
          if (b <= 0.04) continue;
          if (morph[i] > 0) b *= 1 - MORPH_DIP * (1 - Math.abs(morph[i] * 2 - 1)); // soft fade on glyph switch
          if (b > 1) b = 1;                            // clamp BEFORE quantizing (flash can push b > 1)
          let lvl = (b * atlasLevels + 0.5) | 0;       // round to nearest baked level
          if (lvl > atlasLevels) lvl = atlasLevels;
          const ti = chars[i] * nLevels + lvl;
          const sx = (ti % perRow) * cellW, sy = ((ti / perRow) | 0) * cellH;
          ctx.drawImage(flip[i] ? atlasFlip : atlas, sx, sy, cellW, cellH, x, r * cellH, cellW, cellH);
        }
      }
      return;
    }
    // fallback: the atlas couldn't be allocated on this device -- draw glyphs directly
    // (slower, but guarantees the rain still renders rather than failing to load).
    ctx.font = fontStr;
    // Eerie glow: a green shadowBlur behind each glyph. SOFTWARE blur (no texture), set once
    // here so per-cell cost is just the blur itself, not state changes. See GLOW_RADIUS notes.
    const glow = GLOW_RADIUS > 0;
    if (glow) { ctx.shadowColor = 'rgb(' + COL_BODY[0] + ',' + COL_BODY[1] + ',' + COL_BODY[2] + ')'; ctx.shadowBlur = GLOW_RADIUS; }
    for (let c = 0; c < cols; c++) {
      const x = c * cellW;
      const base = c * rows;
      for (let r = 0; r < rows; r++) {
        const i = base + r;
        let b = bright[i] + flash[i];
        if (b <= 0.04) continue;
        if (morph[i] > 0) b *= 1 - MORPH_DIP * (1 - Math.abs(morph[i] * 2 - 1));
        if (b > 1) b = 1;
        let lvl = (b * (PALETTE_N - 1) + 0.5) | 0;          // quantize to the cached palette
        ctx.fillStyle = palette[lvl];                       // reused string -- no per-cell color build/GC
        const ch = glyphChars[chars[i]];                    // prebuilt glyph string (no per-cell fromCharCode)
        if (flip[i]) { ctx.save(); ctx.translate(x + cellW, r * cellH); ctx.scale(-1, 1); ctx.fillText(ch, 0, 0); ctx.restore(); }
        else ctx.fillText(ch, x, r * cellH);
      }
    }
    if (glow) ctx.shadowBlur = 0;   // clear so the next frame's background fill doesn't blur
  }

  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < FRAME_MS) return;
    last = t;
    step();
    render();
  }
  requestAnimationFrame(loop);

  // Keep the panel awake while the rain shows (kiosk apps usually do this too, but
  // this re-asserts it). Re-acquire after the tab is backgrounded and returns.
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') keepAwake();
  });
  keepAwake();

  // Tap-to-exit: most kiosk browsers dismiss their own screensaver on touch, so this
  // is a harmless extra -- window.close() simply no-ops where the browser disallows it.
  window.addEventListener('pointerdown', function () { try { window.close(); } catch (e) {} }, { passive: true });
})();
</script>
</body>
</html>
