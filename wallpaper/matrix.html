<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Matrix "digital rain". Each grid cell keeps its OWN character and brightness:
// the leading head is near-white, the trail behind it is the SAME characters
// fading to green, and occasionally a random cell flips to a new glyph (the
// authentic flicker). Works as a Lively HTML wallpaper, incl. spanned displays.
(function () {
  // ---- tunables ---------------------------------------------------------
  const FRAME_MS   = 50;     // higher = slower animation (~20 fps)
  const SPEED_MIN  = 0.30;   // rows advanced per frame (lower = slower fall)
  const SPEED_MAX  = 0.70;
  // NO FADE, UNIFORM BODY: a lit cell does NOT decay -- the single head cell is full-bright and
  // every other lit cell holds at the SAME body brightness (no settle gradient, flash or dim).
  // Columns clear only via the animated backspace / instant gap erases.
  const BODY_BRIGHT = 0.62;   // steady green EVERY lit body cell holds at (== the color-ramp split); the head alone sits brighter at 1.0
  // Green-blue (teal-leaning) ramp with a near-white -- not pure white -- head. [r,g,b]
  const COL_TAIL = [0, 25, 18];     // deep teal, only seen briefly as a cell clears
  const COL_BODY = [0, 235, 140];   // steady Matrix green (blue-leaning vs the old 0,255,70)
  const COL_HEAD = [235, 255, 250]; // near-white mint head (bright, but not 255,255,255)
  const CHANGE_CHANCE = 0.04; // per-frame chance a lit glyph INSTANTLY swaps to another (constant churn; no fade/dim now)
  // Group change: most swaps are a single glyph, but a triggered change sometimes takes a few
  // CONTIGUOUS neighbors with it, so a small block switches at the same instant (not chunk-ONLY).
  const CHUNK_CHANCE = 0.15;  // share of triggered changes that become a group instead of a single
  const CHUNK_MIN = 2, CHUNK_MAX = 6; // group length (rows) when a change spreads
  const FLIP_RATE   = 0.0015; // fraction of cells mirrored horizontally per frame
  const FLIP_CHANCE = 0.28;   // chance a freshly-lit glyph spawns mirrored
  // ANIMATED BACKSPACE (primary deletion): an erase can start ANYWHERE on a lit line and eats
  // characters one at a time DOWNWARD through the rest of the line, at a fraction of the column's
  // head speed ("at the head speed or slower"). Replaces the old whole-line collapse and INTERRUPT.
  const ERASE_CHANCE = 0.05; // per-frame chance a column with lit cells begins a new animated backspace (main lever for how long standing code lingers)
  const ERASE_SPEED_MIN_FRAC = 0.7; // slowest backspace = this fraction of the column's head speed
  const ERASE_SPEED_MAX_FRAC = 1.0; // fastest backspace = head speed (never faster)
  // Instant small/medium gap "editing" so lines don't pile up solid (the old long-chunk tier is gone).
  const SEG_ERASE_RATE = 0.12;  // instant-erase attempts per frame -- constant small "editing" of every line
  const SEG_SMALL_FRAC = 0.72;  // share of instant erases that nibble just a few chars (rest = a mid-size segment)
  const SEG_SMALL_MIN = 1, SEG_SMALL_MAX = 3;
  const SEG_MED_MIN = 5, SEG_MED_MAX = 18;
  const SPAWN_ON_ERASE = 0.08;  // chance an erase also seeds a NEW falling head at the gap (a third way streams are built)
  const TOP_SPROUT_CHANCE = 0.02; // per-frame chance to drop a fresh white head at the top of a bare-topped frozen column (refills the top; self-limits as the screen fills)
  const RESTART_GAP = 110;     // how far above the top a finished column restarts -- larger = columns REST (dark, headless) longer between streams, so fewer heads fall at once and the field is less crowded
  const FREEZE_CHANCE = 1.0; // when a head reaches the bottom: chance the fallen line STAYS in place
                              //   (frozen, still churning) instead of restarting -- raise for more, lower for fewer
  const MID_FREEZE_CHANCE = 0.002; // per-frame chance a still-FALLING line stops mid-screen and freezes in place
  const MIN_FREEZE_LEN = 10;  // a line must have drawn at least this many chars before it may freeze (no 1-char freezes)
  const LEVELS     = 48;     // brightness quantization for the glyph atlas (49 tiles/glyph; matches src/Matrix.cs)
  // Eerie glow: a blurred, dimmed copy of the finished frame laid back over itself (bloom).
  // GLOW_STRENGTH is shared with src/Matrix.cs; GLOW_RADIUS is the canvas blur in px.
  const GLOW_STRENGTH = 0.95; // opacity of the blurred copy laid over the frame -- gives EVERY glyph (the body too) a glow, not just the heads
  const GLOW_RADIUS   = 6;    // px blur radius for the bloom -- tighter so it HUGS each glyph (a per-character glow) instead of a flat regional haze
  // Dedicated HEAD glow: the body teal is nearly as luminous as the near-white head, so the
  // general bloom can't make the head stand out. Give the leading cells their OWN big bright
  // additive halo so the head clearly leads each line.
  const HEAD_GLOW_RADIUS = 0.95;  // head-halo radius in CELLS -- tight, wraps the character (not a big globe)
  const HEAD_GLOW_STRENGTH = 1.0; // head-halo intensity (0 disables)
  const COL_HEAD_GLOW = [160, 250, 240]; // head-glow color [r,g,b] -- near-white TEAL (not pure white)
  // -----------------------------------------------------------------------

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  const codes = [];
  for (let c = 0xFF66; c <= 0xFF9D; c++) codes.push(c);                 // katakana
  for (const ch of "0123456789*+-/<>=:;.?!^|()[]{}~") codes.push(ch.charCodeAt(0));
  // returns a GLYPH INDEX into codes[] (not a char code) -- the atlas is keyed by index,
  // so the render hot loop needs no String.fromCharCode and no lookup (mirrors C# GlyphIdx)
  const code = () => (Math.random() * codes.length) | 0;

  // Weighted erase length: usually just a few characters, sometimes a mid-size segment.
  // (The old long-chunk tier is gone -- big removals are no longer instant.)
  function segLen() {
    if (Math.random() < SEG_SMALL_FRAC) return SEG_SMALL_MIN + ((Math.random() * (SEG_SMALL_MAX - SEG_SMALL_MIN + 1)) | 0);
    return SEG_MED_MIN + ((Math.random() * (SEG_MED_MAX - SEG_MED_MIN + 1)) | 0);
  }

  let W, H, fontSize, cellW, cellH, cols, rows, fontStr;
  let bright, chars, flip, head, speed, prevRow, sprouts, frozen, lit;
  let eraseActive, erasePos, eraseRemaining, eraseSpeed;   // animated backspace state, per column
  let atlas, atlasFlip, atlasLevels = 0, atlasPerRow = 0;   // sprite-sheets + baked level count + glyph-tiles per atlas row (0 levels = atlas unavailable)
  let hgSprite = [], hgSpriteF = [], hgPad = 0;   // per-glyph GLYPH-SHAPED glow sprites (normal + flipped); halo follows the character, baked once (no per-frame blur)

  // Same gradient as the live render path (and src/Matrix.cs): near-white mint head ->
  // teal-green body -> deep-teal tail. Split at BODY_BRIGHT so a held body cell == COL_BODY.
  // maxLevel = top index in use.
  function levelColor(l, maxLevel) {
    const bb = l / maxLevel;
    let a, b, t;
    if (bb >= BODY_BRIGHT) { a = COL_BODY; b = COL_HEAD; t = (bb - BODY_BRIGHT) / (1 - BODY_BRIGHT); }
    else { a = COL_TAIL; b = COL_BODY; t = bb / BODY_BRIGHT; }
    const cr = (a[0] + (b[0] - a[0]) * t) | 0;
    const cg = (a[1] + (b[1] - a[1]) * t) | 0;
    const cb = (a[2] + (b[2] - a[2]) * t) | 0;
    return 'rgb(' + cr + ',' + cg + ',' + cb + ')';
  }

  // Paint one sprite-sheet (normal or mirrored). Tiles are packed in 2D -- `perRow`
  // tiles per row, wrapping to as many rows as needed -- so NEITHER dimension exceeds
  // the texture cap (a single long row did, and blitted black). Tile index
  // ti = glyph*nLevels + level sits at (ti % perRow, ti / perRow). Returns the canvas,
  // or null if the device clamps the size or can't allocate it.
  function paintSheet(nLevels, perRow, mirror) {
    const tilesT = codes.length * nLevels;
    const rowsT = Math.ceil(tilesT / perRow);
    const sheetW = perRow * cellW, sheetH = rowsT * cellH;
    try {
      const cv = document.createElement('canvas');
      cv.width = sheetW; cv.height = sheetH;
      if (cv.width !== sheetW || cv.height !== sheetH) return null;   // device clamped the size
      const g = cv.getContext('2d', { alpha: false });
      if (!g) return null;                                           // out of canvas memory
      g.fillStyle = '#000'; g.fillRect(0, 0, sheetW, sheetH);
      g.font = fontStr; g.textBaseline = 'top';
      for (let gi = 0; gi < codes.length; gi++) {
        const ch = String.fromCharCode(codes[gi]);   // build-time only, never per frame
        for (let l = 0; l < nLevels; l++) {
          const ti = gi * nLevels + l;
          const dx = (ti % perRow) * cellW, dy = ((ti / perRow) | 0) * cellH;
          g.fillStyle = levelColor(l, nLevels - 1);
          if (mirror) { g.save(); g.translate(dx + cellW, dy); g.scale(-1, 1); g.fillText(ch, 0, 0); g.restore(); }
          else g.fillText(ch, dx, dy);
        }
      }
      return cv;
    } catch (e) { return null; }
  }

  // Confirm a freshly painted sheet actually BLITS (not just allocates): some WebViews
  // accept an oversized canvas yet draw nothing from it. Copy the brightest tile of
  // glyph 0 onto a scratch canvas and check it isn't all black. Cheap insurance against
  // a silent black screen -- on failure, render() drops to the direct-draw fallback.
  function atlasBlits(sheet, lv, perRow) {
    try {
      const ti = lv;                              // glyph 0, brightest level (= lv): near-white ink
      const sx = (ti % perRow) * cellW, sy = ((ti / perRow) | 0) * cellH;
      const t = document.createElement('canvas');
      t.width = cellW; t.height = cellH;
      const tg = t.getContext('2d');
      tg.fillStyle = '#000'; tg.fillRect(0, 0, cellW, cellH);
      tg.drawImage(sheet, sx, sy, cellW, cellH, 0, 0, cellW, cellH);
      const d = tg.getImageData(0, 0, cellW, cellH).data;
      for (let i = 0; i < d.length; i += 4) if (d[i] || d[i + 1] || d[i + 2]) return true;
      return false;
    } catch (e) { return false; }
  }

  // Pre-render every glyph at every brightness level into two 2D-packed sprite-sheets
  // (normal + mirrored), so each frame is a fast drawImage blit instead of a per-cell
  // fillText. This is the canvas analogue of the glyph bitmap cache in src/Matrix.cs.
  // The atlas is packed under the GPU's texture cap; if the full-resolution sheet won't
  // fit (too tall) or won't blit on this device, halve the level count and retry -- the
  // fast path survives, only the gradient gets coarser. atlasLevels === 0 means even the
  // smallest atlas failed and render() falls back to direct fillText. Rebuilt from
  // resize() when the cell size / font changes -- never in the frame loop.
  function buildAtlas() {
    atlas = atlasFlip = null; atlasLevels = 0; atlasPerRow = 0;
    // Pack under a CONSERVATIVE FIXED cap -- NOT the device's real MAX_TEXTURE_SIZE.
    // 2048 is the GLES2-guaranteed minimum, so it is safe in BOTH dimensions on every
    // GPU. We deliberately do NOT probe the cap with a throwaway WebGL context: on weak
    // tablet WebViews, creating one alongside the large 2D atlas canvases can crash the
    // GPU process, and a probe only ever let us build a BIGGER atlas -- the wrong
    // direction. A smaller-than-needed atlas is free: it is built once per resize and
    // every tile blit costs the same regardless of sheet size.
    const cap = 2048;
    const perRow = Math.max(1, (cap / cellW) | 0);   // glyph-tiles per row that fit under the width cap
    for (let lv = LEVELS; lv >= 6; lv = lv >> 1) {
      const nLevels = lv + 1;
      const rowsT = Math.ceil(codes.length * nLevels / perRow);
      if (rowsT * cellH > cap) continue;             // too tall at this level count -- coarsen and retry
      const a = paintSheet(nLevels, perRow, false);
      const f = a && paintSheet(nLevels, perRow, true);
      if (a && f && atlasBlits(a, lv, perRow) && atlasBlits(f, lv, perRow)) {
        atlas = a; atlasFlip = f; atlasLevels = lv; atlasPerRow = perRow; return;
      }
    }
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.width = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    // Glyph size keyed to a single monitor's height, so it looks the same
    // whether Lively runs us per-monitor or spanned across all displays.
    const refH = ((window.screen && window.screen.height) ? window.screen.height : 1080) * dpr;
    fontSize = Math.max(14, Math.floor(refH / 55));
    fontStr = "bold " + fontSize + "px 'MS Gothic','Yu Gothic',monospace";
    ctx.font = fontStr;
    ctx.textBaseline = 'top';
    cellW = Math.max(6, Math.ceil(ctx.measureText('ｴ').width));
    cellH = Math.ceil(fontSize * 1.05);

    cols = Math.max(1, Math.floor(W / cellW));
    rows = Math.max(1, Math.floor(H / cellH) + 1);

    bright  = new Float32Array(cols * rows);
    chars   = new Uint16Array(cols * rows);
    flip    = new Uint8Array(cols * rows);
    head    = new Float32Array(cols);
    speed   = new Float32Array(cols);
    prevRow = new Int32Array(cols);
    sprouts = [];   // secondary heads spawned where code was erased (reset on resize)
    frozen  = new Uint8Array(cols);   // 1 = column has frozen into static code (set on reaching bottom)
    lit     = new Int32Array(cols);   // length of each column's current falling line (gates freezing)
    eraseActive    = new Uint8Array(cols);   // 1 = an animated backspace is in progress in this column
    erasePos       = new Float32Array(cols); // fractional row the backspace is eating at (advances downward)
    eraseRemaining = new Int32Array(cols);   // characters still to remove in the current backspace
    eraseSpeed     = new Float32Array(cols); // rows/frame for this backspace (a fraction of the head speed)
    for (let c = 0; c < cols; c++) {
      head[c] = -Math.random() * rows;
      speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      prevRow[c] = Math.floor(head[c]);
    }
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.imageSmoothingEnabled = false;   // crisp 1:1 integer blits (canvas DrawImageUnscaled)
    buildAtlas();                        // (re)bake the glyph sheets for the new cell size
    buildHeadGlyphGlow();                // (re)bake the per-glyph head-glow sprites for the new cell size
  }

  // Pre-render a GLYPH-SHAPED glow sprite for every glyph (normal + flipped): the character drawn
  // with a shadowBlur halo on a transparent tile, so the glow follows the character's outline (not
  // a circle). Built once per resize (shadowBlur is build-time only); the per-frame head glow is
  // then just a cheap drawImage of the matching sprite.
  function buildHeadGlyphGlow() {
    const blur = Math.max(2, Math.round(cellH * HEAD_GLOW_RADIUS));
    hgPad = blur + 1;
    const w = cellW + hgPad * 2, h = cellH + hgPad * 2;
    hgSprite = []; hgSpriteF = [];
    for (let gi = 0; gi < codes.length; gi++) {
      const ch = String.fromCharCode(codes[gi]);
      for (let m = 0; m < 2; m++) {                 // m=0 normal, m=1 flipped
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const g = cv.getContext('2d');
        g.font = fontStr; g.textBaseline = 'top';
        const gc = 'rgb(' + COL_HEAD_GLOW[0] + ',' + COL_HEAD_GLOW[1] + ',' + COL_HEAD_GLOW[2] + ')';
        g.fillStyle = gc;
        g.shadowColor = gc;
        g.shadowBlur = blur;
        if (m) { g.translate(hgPad + cellW, hgPad); g.scale(-1, 1); g.fillText(ch, 0, 0); g.fillText(ch, 0, 0); }
        else   { g.fillText(ch, hgPad, hgPad);      g.fillText(ch, hgPad, hgPad); }   // 2x = stronger halo
        (m ? hgSpriteF : hgSprite).push(cv);
      }
    }
  }

  window.addEventListener('resize', resize);
  resize();

  function step() {
    // 1) UNIFORM BODY, NO FADE: every lit cell snaps to BODY_BRIGHT (the head re-asserts itself to
    //    1.0 in the lifecycle pass below). Glyph changes are INSTANT -- no morph fade, no dim, no flash.
    for (let c = 0; c < cols; c++) {
      const base = c * rows;
      for (let r = 0; r < rows; r++) {
        const i = base + r;
        if (bright[i] > BODY_BRIGHT) bright[i] = BODY_BRIGHT;   // instant settle -> uniform body
        if (bright[i] > 0.12 && Math.random() < CHANGE_CHANCE) {
          // usually a single glyph; sometimes a contiguous group switches together (upward, over
          // cells already visited this step) -- an INSTANT swap, no fade.
          const len = (Math.random() < CHUNK_CHANCE) ? (CHUNK_MIN + ((Math.random() * (CHUNK_MAX - CHUNK_MIN + 1)) | 0)) : 1;
          for (let k = 0; k < len && r - k >= 0; k++) {
            const j = base + r - k;
            if (bright[j] > 0.12) chars[j] = code();
          }
        }
      }
    }

    // 2) Falling columns: advance the head, write the trail at BODY_BRIGHT, and hold the single
    //    head cell full-bright. At the bottom a long-enough line may FREEZE (stand) to be
    //    backspaced; else it restarts. Frozen columns don't advance.
    for (let c = 0; c < cols; c++) {
      if (frozen[c]) continue;
      const base = c * rows;
      head[c] += speed[c];
      const nr = Math.floor(head[c]);
      if (nr !== prevRow[c]) {
        for (let r = prevRow[c] + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            const idx = base + r;
            chars[idx] = code();
            flip[idx] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[idx] = BODY_BRIGHT;
            lit[c]++;   // grow this line's length -- gates freezing so short stubs can't stay
          }
        }
        prevRow[c] = nr;
      }
      if (nr >= 0 && nr < rows) bright[base + nr] = 1.0;   // the head cell alone holds full-bright

      if (head[c] > rows + 6) {
        if (lit[c] >= MIN_FREEZE_LEN && Math.random() < FREEZE_CHANCE) frozen[c] = 1; // stand, to be backspaced
        else restartColumn(c);
      } else if (lit[c] >= MIN_FREEZE_LEN && Math.random() < MID_FREEZE_CHANCE) {
        frozen[c] = 1; // a still-falling line can stop mid-screen and stand
      }
    }

    // 2b) ANIMATED BACKSPACE (primary deletion): a backspace can begin ANYWHERE on a lit line and
    //     eats characters one at a time DOWNWARD, at a fraction of the column's head speed. It runs
    //     on falling and frozen columns alike; a frozen column fully cleared recycles from the top.
    for (let c = 0; c < cols; c++) {
      const base = c * rows;
      if (!eraseActive[c] && Math.random() < ERASE_CHANCE) {
        const start = pickLitRow(c);
        if (start >= 0) {
          eraseActive[c] = 1;
          erasePos[c] = start;
          eraseRemaining[c] = rows;   // eat from the start point down through the rest of the line
          eraseSpeed[c] = speed[c] * (ERASE_SPEED_MIN_FRAC + Math.random() * (ERASE_SPEED_MAX_FRAC - ERASE_SPEED_MIN_FRAC));
        }
      }
      if (eraseActive[c]) {
        const from = Math.floor(erasePos[c]);
        erasePos[c] += eraseSpeed[c];
        const to = Math.floor(erasePos[c]);
        for (let r = from; r <= to && eraseRemaining[c] > 0; r++) {
          if (r >= 0 && r < rows && bright[base + r] > 0.001) { bright[base + r] = 0; eraseRemaining[c]--; }
        }
        if (eraseRemaining[c] <= 0 || erasePos[c] >= rows) eraseActive[c] = 0;
      }
      if (frozen[c] && !eraseActive[c] && columnEmpty(c)) restartColumn(c);
    }

    // 3) mirror a few random lit cells horizontally (kept churn; no flash now)
    const flips = Math.max(1, (cols * rows * FLIP_RATE) | 0);
    for (let k = 0; k < flips; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.15) flip[idx] ^= 1;
    }

    // 4) instant small/medium gap "editing" so lines don't pile up solid (no long-chunk tier now)
    const segErases = Math.max(1, (cols * SEG_ERASE_RATE) | 0);
    for (let k = 0; k < segErases; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.2) {
        const base = ((idx / rows) | 0) * rows;
        const r0 = idx % rows;
        const len = segLen();
        for (let r = r0; r < r0 + len && r < rows; r++) bright[base + r] = 0;
        // ...and sometimes regrow: drop a fresh head at the top of the gap so a NEW stream re-writes it
        if (sprouts.length < cols && Math.random() < SPAWN_ON_ERASE) {
          chars[base + r0] = code(); flip[base + r0] = (Math.random() < FLIP_CHANCE) ? 1 : 0; bright[base + r0] = 1.0;
          sprouts.push({ col: (idx / rows) | 0, pos: r0, speed: SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN), prev: r0 });
        }
      }
    }

    // 5) keep the TOP from going bare: occasionally drop a fresh head at the top of a frozen
    //    column whose top has cleared. It falls and re-lights the column.
    if (sprouts.length < cols && Math.random() < TOP_SPROUT_CHANCE) {
      const col = (Math.random() * cols) | 0;
      if (frozen[col] && bright[col * rows] < 0.3) {
        const b = col * rows;
        chars[b] = code(); flip[b] = (Math.random() < FLIP_CHANCE) ? 1 : 0; bright[b] = 1.0;
        sprouts.push({ col: col, pos: 0, speed: SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN), prev: 0 });
      }
    }

    // 6) advance those regrowth heads like the main heads: trail at BODY_BRIGHT, head full-bright
    for (let s = sprouts.length - 1; s >= 0; s--) {
      const sp = sprouts[s];
      sp.pos += sp.speed;
      const nr = Math.floor(sp.pos);
      if (nr !== sp.prev) {
        const b = sp.col * rows;
        for (let r = sp.prev + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            chars[b + r] = code();
            flip[b + r] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[b + r] = BODY_BRIGHT;
          }
        }
        sp.prev = nr;
      }
      if (nr >= 0 && nr < rows) bright[sp.col * rows + nr] = 1.0;   // sprout head full-bright
      if (sp.pos > rows + 6) sprouts.splice(s, 1);
    }
  }

  function restartColumn(c) {
    frozen[c] = 0;
    eraseActive[c] = 0;
    head[c] = -((Math.random() * RESTART_GAP) | 0);
    prevRow[c] = Math.floor(head[c]);
    speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
    lit[c] = 0;
  }

  // A random LIT row in column c (scanning from a random offset), or -1 if none -- so a
  // backspace can begin "anywhere on the line".
  function pickLitRow(c) {
    const base = c * rows;
    const r0 = (Math.random() * rows) | 0;
    for (let k = 0; k < rows; k++) {
      let r = r0 + k; if (r >= rows) r -= rows;
      if (bright[base + r] > 0.12) return r;
    }
    return -1;
  }

  function columnEmpty(c) {
    const base = c * rows;
    for (let r = 0; r < rows; r++) if (bright[base + r] > 0.001) return false;
    return true;
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    if (atlasLevels > 0) {
      // fast path: each lit cell is one pre-rendered glyph blit (tiles are 2D-packed:
      // tile ti = glyph*nLevels + level lives at (ti % atlasPerRow, ti / atlasPerRow))
      const nLevels = atlasLevels + 1, perRow = atlasPerRow;
      for (let c = 0; c < cols; c++) {
        const x = c * cellW;
        const base = c * rows;
        for (let r = 0; r < rows; r++) {
          const i = base + r;
          const b = bright[i];                         // only ever 0, BODY_BRIGHT, or 1.0 now
          if (b <= 0.04) continue;
          let lvl = (b * atlasLevels + 0.5) | 0;       // round to nearest baked level
          if (lvl > atlasLevels) lvl = atlasLevels;
          const ti = chars[i] * nLevels + lvl;
          const sx = (ti % perRow) * cellW, sy = ((ti / perRow) | 0) * cellH;
          ctx.drawImage(flip[i] ? atlasFlip : atlas, sx, sy, cellW, cellH, x, r * cellH, cellW, cellH);
        }
      }
    } else {
      // fallback: the atlas couldn't be allocated on this device -- draw glyphs directly.
      ctx.font = fontStr;
      for (let c = 0; c < cols; c++) {
        const x = c * cellW;
        const base = c * rows;
        for (let r = 0; r < rows; r++) {
          const i = base + r;
          const b = bright[i];                 // only ever 0, BODY_BRIGHT, or 1.0 now
          if (b <= 0.04) continue;
          ctx.fillStyle = levelColor(b, 1);   // same ramp as the atlas (maxLevel 1 -> bb = b)
          const ch = String.fromCharCode(codes[chars[i]]);   // chars stores a glyph INDEX
          if (flip[i]) { ctx.save(); ctx.translate(x + cellW, r * cellH); ctx.scale(-1, 1); ctx.fillText(ch, 0, 0); ctx.restore(); }
          else ctx.fillText(ch, x, r * cellH);
        }
      }
    }
    glow();
    headGlow();
  }

  // Eerie glow: lay a blurred, dimmed copy of the finished frame back over itself (cross-cell
  // bloom). Additive ('lighter') so it brightens the black around glyphs into a soft halo.
  function glow() {
    const dpr = window.devicePixelRatio || 1;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = GLOW_STRENGTH;
    ctx.filter = 'blur(' + (GLOW_RADIUS * dpr) + 'px)';
    ctx.drawImage(canvas, 0, 0, W, H);
    ctx.filter = 'none';
    ctx.restore();
  }

  // A GLYPH-SHAPED glow on each actively-falling head (and regrowth sprout): blit the matching
  // glyph's prebaked glow sprite at the head cell, additively. The halo follows the character's
  // outline (not a circle), the glyph shows through, and it's one cheap blit per head -- no
  // per-frame blur, no strobe. Frozen (standing) lines have no leading head, so they get none.
  function headGlow() {
    if (HEAD_GLOW_STRENGTH <= 0 || !hgSprite.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = HEAD_GLOW_STRENGTH;
    for (let c = 0; c < cols; c++) {
      if (frozen[c]) continue;
      const hp = head[c];
      if (hp < 0 || hp >= rows) continue;
      const rr = hp | 0, idx = c * rows + rr;
      ctx.drawImage(flip[idx] ? hgSpriteF[chars[idx]] : hgSprite[chars[idx]], c * cellW - hgPad, rr * cellH - hgPad);
    }
    for (let s = 0; s < sprouts.length; s++) {
      const sp = sprouts[s];
      if (sp.pos < 0 || sp.pos >= rows) continue;
      const rr = sp.pos | 0, idx = sp.col * rows + rr;
      ctx.drawImage(flip[idx] ? hgSpriteF[chars[idx]] : hgSprite[chars[idx]], sp.col * cellW - hgPad, rr * cellH - hgPad);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < FRAME_MS) return;
    last = t;
    step();
    render();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
