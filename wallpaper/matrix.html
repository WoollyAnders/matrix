<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrix</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #c { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Matrix "digital rain". Each grid cell keeps its OWN character and brightness:
// the leading head is near-white, the trail behind it is the SAME characters
// fading to green, and occasionally a random cell flips to a new glyph (the
// authentic flicker). Works as a Lively HTML wallpaper, incl. spanned displays.
(function () {
  // ---- tunables ---------------------------------------------------------
  const FRAME_MS   = 50;     // higher = slower animation (~20 fps)
  const SPEED_MIN  = 0.45;   // rows advanced per frame (lower = slower fall)
  const SPEED_MAX  = 1.00;
  const DECAY      = 0.96;    // trail fade per frame (higher = longer tails)
  const FLASH_BOOST = 0.5;    // momentary extra glow when a glyph changes/flips
  const FLASH_DECAY = 0.45;   // how fast that flash fades (low = brief); base tail fade unchanged
  const CHANGE_CHANCE = 0.10; // per-frame chance a lit trailing glyph silently morphs (constant churn)
  const GLITCH_RATE = 0.0020; // fraction of cells that change glyph WITH a flash (emphasis)
  const FLIP_RATE   = 0.0015; // fraction of cells mirrored horizontally per frame
  const FLIP_CHANCE = 0.28;   // chance a freshly-lit glyph spawns mirrored
  const INTERRUPT_CHANCE = 0.004; // per-frame chance a whole column is wiped & restarted ("being edited")
  // "being edited": each erase punches a gap of a RANDOM scale into a lit stream --
  // mostly a few stray characters, sometimes a segment, occasionally a long chunk
  // (a whole-column wipe is the separate INTERRUPT_CHANCE above).
  const SEG_ERASE_RATE = 0.12;  // erase attempts per column per frame
  const SEG_SMALL_FRAC = 0.65;  // share of erases that nibble just a few chars
  const SEG_MED_FRAC = 0.27;    // share that take out a mid-size segment (rest = long chunk)
  const SEG_SMALL_MIN = 1, SEG_SMALL_MAX = 3;
  const SEG_MED_MIN = 5, SEG_MED_MAX = 18;
  const SEG_LARGE_MIN = 28, SEG_LARGE_MAX = 64;
  const SPAWN_ON_ERASE = 0.15;  // chance an erase also seeds a NEW falling head at the gap (a third way streams are built)
  const RESTART_GAP = 22;     // how far above the top a finished column restarts
  // -----------------------------------------------------------------------

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  const codes = [];
  for (let c = 0xFF66; c <= 0xFF9D; c++) codes.push(c);                 // katakana
  for (const ch of "0123456789*+-/<>=:;.?!^|()[]{}~") codes.push(ch.charCodeAt(0));
  const code = () => codes[(Math.random() * codes.length) | 0];

  // Weighted erase length: usually a few characters, sometimes a segment, rarely a long chunk.
  function segLen() {
    const t = Math.random();
    if (t < SEG_SMALL_FRAC) return SEG_SMALL_MIN + ((Math.random() * (SEG_SMALL_MAX - SEG_SMALL_MIN + 1)) | 0);
    if (t < SEG_SMALL_FRAC + SEG_MED_FRAC) return SEG_MED_MIN + ((Math.random() * (SEG_MED_MAX - SEG_MED_MIN + 1)) | 0);
    return SEG_LARGE_MIN + ((Math.random() * (SEG_LARGE_MAX - SEG_LARGE_MIN + 1)) | 0);
  }

  let W, H, fontSize, cellW, cellH, cols, rows;
  let bright, chars, flip, flash, head, speed, prevRow, sprouts;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.width = Math.floor(window.innerWidth * dpr);
    H = canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    // Glyph size keyed to a single monitor's height, so it looks the same
    // whether Lively runs us per-monitor or spanned across all displays.
    const refH = ((window.screen && window.screen.height) ? window.screen.height : 1080) * dpr;
    fontSize = Math.max(14, Math.floor(refH / 55));
    ctx.font = "bold " + fontSize + "px 'MS Gothic','Yu Gothic',monospace";
    ctx.textBaseline = 'top';
    cellW = Math.max(6, Math.ceil(ctx.measureText('ｴ').width));
    cellH = Math.ceil(fontSize * 1.05);

    cols = Math.max(1, Math.floor(W / cellW));
    rows = Math.max(1, Math.floor(H / cellH) + 1);

    bright  = new Float32Array(cols * rows);
    chars   = new Uint16Array(cols * rows);
    flip    = new Uint8Array(cols * rows);
    flash   = new Float32Array(cols * rows);
    head    = new Float32Array(cols);
    speed   = new Float32Array(cols);
    prevRow = new Int32Array(cols);
    sprouts = [];   // secondary heads spawned where code was erased (reset on resize)
    for (let c = 0; c < cols; c++) {
      head[c] = -Math.random() * rows;
      speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      prevRow[c] = Math.floor(head[c]);
    }
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
  }

  window.addEventListener('resize', resize);
  resize();

  function step() {
    // 1) fade every cell a little (trail keeps its character, just dims)
    for (let i = 0; i < bright.length; i++) {
      if (bright[i] > 0.001) bright[i] *= DECAY;
      flash[i] = (flash[i] > 0.001) ? flash[i] * FLASH_DECAY : 0;
      // constantly cycle visible trailing glyphs (no flash) -- the "always changing" look
      if (bright[i] > 0.12 && Math.random() < CHANGE_CHANCE) chars[i] = code();
    }

    // 2) advance each column's head, lighting new cells with fresh glyphs
    for (let c = 0; c < cols; c++) {
      head[c] += speed[c];
      const nr = Math.floor(head[c]);
      if (nr !== prevRow[c]) {
        for (let r = prevRow[c] + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            const idx = c * rows + r;
            chars[idx] = code();
            flip[idx] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[idx] = 1.0;
          }
        }
        prevRow[c] = nr;
      }
      if (head[c] > rows + 6) {
        head[c] = -((Math.random() * RESTART_GAP) | 0);
        prevRow[c] = Math.floor(head[c]);
        speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      } else if (Math.random() < INTERRUPT_CHANCE) {
        // "being edited": wipe this stream, then replace it -- half the time a
        // fresh stream from the top (renewal), half a mid-screen reappearance (edit).
        for (let r = 0; r < rows; r++) { const idx = c * rows + r; bright[idx] = 0; flash[idx] = 0; }
        head[c] = (Math.random() < 0.5) ? -Math.random() * RESTART_GAP : Math.random() * rows;
        prevRow[c] = Math.floor(head[c]);
        speed[c] = SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN);
      }
    }

    // 3) flicker: change a few random lit cells to a new glyph (authentic churn)
    const glitches = Math.max(1, (cols * rows * GLITCH_RATE) | 0);
    for (let k = 0; k < glitches; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.15) { chars[idx] = code(); flash[idx] = FLASH_BOOST; }
    }

    // 4) ...and mirror a few other random lit cells horizontally
    const flips = Math.max(1, (cols * rows * FLIP_RATE) | 0);
    for (let k = 0; k < flips; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.15) { flip[idx] ^= 1; flash[idx] = FLASH_BOOST; }
    }

    // 6) ...and punch random-scale gaps into random lit streams ("sections taken out"):
    //    a few stray characters, a mid-size segment, or a long chunk -- see segLen()
    const segErases = Math.max(1, (cols * SEG_ERASE_RATE) | 0);
    for (let k = 0; k < segErases; k++) {
      const idx = (Math.random() * bright.length) | 0;
      if (bright[idx] > 0.2) {
        const base = ((idx / rows) | 0) * rows;
        const r0 = idx % rows;
        const len = segLen();
        for (let r = r0; r < r0 + len && r < rows; r++) { bright[base + r] = 0; flash[base + r] = 0; }
        // ...and sometimes regrow: drop a fresh head in at the top of the gap so a NEW
        // stream re-writes where code was just removed (third build path).
        if (sprouts.length < cols && Math.random() < SPAWN_ON_ERASE) {
          chars[base + r0] = code(); flip[base + r0] = (Math.random() < FLIP_CHANCE) ? 1 : 0; bright[base + r0] = 1.0;
          sprouts.push({ col: (idx / rows) | 0, pos: r0, speed: SPEED_MIN + Math.random() * (SPEED_MAX - SPEED_MIN), prev: r0 });
        }
      }
    }

    // 7) advance those regrowth heads like the main heads, dropping them off the bottom
    for (let s = sprouts.length - 1; s >= 0; s--) {
      const sp = sprouts[s];
      sp.pos += sp.speed;
      const nr = Math.floor(sp.pos);
      if (nr !== sp.prev) {
        const b = sp.col * rows;
        for (let r = sp.prev + 1; r <= nr; r++) {
          if (r >= 0 && r < rows) {
            chars[b + r] = code();
            flip[b + r] = (Math.random() < FLIP_CHANCE) ? 1 : 0;
            bright[b + r] = 1.0;
          }
        }
        sp.prev = nr;
      }
      if (sp.pos > rows + 6) sprouts.splice(s, 1);
    }
  }

  function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.font = "bold " + fontSize + "px 'MS Gothic','Yu Gothic',monospace";
    for (let c = 0; c < cols; c++) {
      const x = c * cellW;
      const base = c * rows;
      for (let r = 0; r < rows; r++) {
        let b = bright[base + r] + flash[base + r];
        if (b <= 0.04) continue;
        if (b > 1) b = 1;
        // gradient: pure-white head -> matrix green -> black tail
        let cr, cg, cb;
        if (b >= 0.8) { const t = (b - 0.8) / 0.2; cr = (255 * t) | 0; cg = 255; cb = (70 + 185 * t) | 0; }
        else { const t = b / 0.8; cr = 0; cg = (255 * t) | 0; cb = (70 * t) | 0; }
        ctx.fillStyle = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
        const ch = String.fromCharCode(chars[base + r]);
        if (flip[base + r]) {
          ctx.save();
          ctx.translate(x + cellW, r * cellH);
          ctx.scale(-1, 1);
          ctx.fillText(ch, 0, 0);
          ctx.restore();
        } else {
          ctx.fillText(ch, x, r * cellH);
        }
      }
    }
  }

  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < FRAME_MS) return;
    last = t;
    step();
    render();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
